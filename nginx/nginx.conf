upstream api {
    server app:8000;
}

upstream dashboard {
    server dashboard:8501;
}

upstream signoz {
    server signoz:8080;
}

upstream mlflow {
    server mlflow:5000;
}

upstream webapp {
    server webapp:3000;
}

server {
    listen 80;
    server_name _;

    # -- API: /api/* and /openapi.json --
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- Swagger/ReDoc: /docs, /redoc, /openapi.json --
    location /docs {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # -- Drift Dashboard (Streamlit): /drift/* --
    location /drift/ {
        proxy_pass http://dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_stcore/ {
        proxy_pass http://dashboard/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://dashboard/static/;
        proxy_set_header Host $host;
    }

    # -- MLflow: /mlflow/* --
    location /mlflow/ {
        proxy_pass http://mlflow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- SigNoz: /signoz/* --
    location /signoz/ {
        proxy_pass http://signoz/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- Web App (root): / --
    location / {
        proxy_pass http://webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}