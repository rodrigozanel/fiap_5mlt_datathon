name: CI - Docker Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "webapp/Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "app/**"
      - "src/**"

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: passos-magicos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-webapp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Webapp image
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: false
          tags: passos-magicos-webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
