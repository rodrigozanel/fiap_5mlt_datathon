name: Security - Dependencies

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-* || true

      - name: Install Poetry and export deps
        run: |
          pip install poetry
          poetry export -f requirements.txt --without-hashes -o /tmp/poetry-deps.txt 2>/dev/null || true

      - name: Audit Poetry dependencies
        if: hashFiles('/tmp/poetry-deps.txt') != ''
        run: pip-audit -r /tmp/poetry-deps.txt || true
