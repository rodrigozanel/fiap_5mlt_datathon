name: "CD: Deploy to DigitalOcean"

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure instead of applying"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}
  TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
  TF_VAR_api_username: ${{ secrets.API_USERNAME }}
  TF_VAR_api_password: ${{ secrets.API_PASSWORD }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        if: inputs.destroy != 'true'

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        if: inputs.destroy != 'true'

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        if: inputs.destroy == 'true'

      - name: Show Outputs
        run: terraform output
        if: inputs.destroy != 'true'
